<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Main App - Advanced Search</title>

  <!-- Fonts and CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <link href="mainapp.css?v=2.0" rel="stylesheet">

  <!-- 1) Load jQuery BEFORE toastr -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- 2) Load toastr AFTER jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="/config.js"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="container">
        <a href="/home_logged.html" class="brand">PERSONALIZED TOURIST GUIDE</a>
      </div>
    </nav>
  </header>

  <section class="hero-section">
    <div class="container hero-container">
      <h1>Advanced Search</h1>
    </div>
  </section>

  <div class="content-container">
    <section class="search-section">
      <!-- General Search Bar -->
      <div class="overall-search-container">
        <textarea
          class="overall-search"
          placeholder="Search all..."
          aria-label="Overall Search"
          rows="1"
          maxlength="500"
        ></textarea>
      </div>

      <!-- Filters (Countries, Cities, Attractions, Days) -->
      <div class="filter-options">
        <!-- Countries -->
        <div class="dropdown">
          <button class="dropdown-toggle">Select Countries</button>
          <div id="countries-list" class="dropdown-menu">
            <input
              type="text"
              class="dropdown-search"
              placeholder="Search countries..."
              aria-label="Search Countries"
            />
            <div class="dropdown-items"></div>
          </div>
        </div>

        <!-- Cities -->
        <div class="dropdown">
          <button class="dropdown-toggle">Select Cities</button>
          <div id="cities-list" class="dropdown-menu">
            <input
              type="text"
              class="dropdown-search"
              placeholder="Search cities..."
              aria-label="Search Cities"
            />
            <div class="dropdown-items"></div>
          </div>
        </div>

        <!-- Attractions -->
        <div class="dropdown">
          <button class="dropdown-toggle">Select Attractions</button>
          <div id="attractions-list" class="dropdown-menu">
            <input
              type="text"
              class="dropdown-search"
              placeholder="Search attractions..."
              aria-label="Search Attractions"
            />
            <div class="dropdown-items"></div>
          </div>
        </div>

        <!-- Days -->
        <div class="dropdown">
          <button class="dropdown-toggle">Select Days</button>
          <div id="days-list" class="dropdown-menu">
            <input
              type="text"
              class="dropdown-search"
              placeholder="Search days..."
              aria-label="Search Days"
            />
            <div class="dropdown-items"></div>
          </div>
        </div>
      </div>

      <!-- Search Button -->
      <button id="search-button" class="search-button">Search</button>

      <!-- Map Div -->
      <div id="map" style="height: 500px; width: 100%; margin-top: 20px;"></div>

      <!-- Monument List Div -->
      <div class="monument-list">
        <h2>Monuments to Visit:</h2>
        <ol></ol>

        <!-- Add Monument Button -->
        <button id="add-button" class="add-button">Add Monument</button>

        <!-- Transport Mode Selector -->
        <div class="transport-mode-container" style="margin-top: 10px;">
          <label for="travel-mode"><strong>Transport Mode:</strong></label>
          <select id="travel-mode" class="travel-mode-select">
            <option value="DRIVING" selected>Car</option>
            <option value="WALKING">Walking</option>
            <option value="BICYCLING">Bicycle</option>
          </select>
        </div>

        <!-- Save Route Button -->
        <button id="save-button" class="save-button" style="margin-top: 10px;">Save Route</button>

        <!-- Favorite / Unfavorite Buttons -->
        <button id="favorite-button" class="favorite-button">
          Mark as Favorite
        </button>
        <button id="unfavorite-button" class="unfavorite-button" style="display: none;">
          Remove from Favorites
        </button>
      </div>

      <!-- Itinerary Div -->
      <div class="itinerary-list">
        <h2>Itinerary</h2>
        <ol id="itinerary-ordered-list"></ol>
      </div>
    </section>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2024 Personalized Tourist Guide - All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Main Script (compiled) -->
  <script src="/build/mainapp.js" defer></script>

  <!-- Google Maps API loader -->
  <script src="/load-google-maps.js" data-callback="initMap" data-language="en" defer></script>

</body>
</html>
