<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <link href="register.css?v=1.0" rel="stylesheet">
    <title>Register - Personalized Tourist Guide</title>
    <script src="/config.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="/" class="brand">PERSONALIZED TOURIST GUIDE</a>
            </div>
        </nav>
    </header>

    <section class="hero-section">
        <div class="container hero-container">
            <h2>Create Account</h2>
        </div>
    </section>

    <div class="register-container">
        <div class="register-card">
            <h3>Sign up for Personalized Tourist Guide</h3>
            <a href="#" class="google-register">
                <img src="google-icon2.png" alt="Google Icon" class="google-icon"> Continue with Google
            </a>
            <div class="or-text">or</div>
            <form id="register-form">
                <div class="form-group">
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" class="form-control" placeholder="First name..." required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" class="form-control" placeholder="Last name..." required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" class="form-control" placeholder="Email..." required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" class="form-control" placeholder="Password..." required>
                </div>
                <button type="submit" class="register-button">Register</button>
            </form>
            <div class="links">
                <a href="/login.html">Already have an account? Log in</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Copyright &copy; 2024 Personalized Tourist Guide - All Rights Reserved.</p>
        </div>
    </footer>
    <script src="/build/register.js"></script>
</body>
</html>
