<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <link href="login.css?v=1.0" rel="stylesheet">
    <title>Login - Personalized Tourist Guide</title>
    <script src="/config.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="/" class="brand">PERSONALIZED TOURIST GUIDE</a>
            </div>
        </nav>
    </header>

    <section class="hero-section">
        <div class="container hero-container">
            <h2>Log in</h2>
        </div>
    </section>

    <div class="login-container">
        <div class="login-card">
            <h3>Sign in to Personalized Tourist Guide</h3>
            <a href="#" class="google-login">
              <img src="google-icon2.png" alt="Google Icon" class="google-icon"> Continue with Google
          </a>
          
            <div class="or-text">or</div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" class="form-control" placeholder="Email..." required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" class="form-control" placeholder="Password..." required>
                </div>
                <button type="submit" class="login-button">Log in</button>
            </form>
            <div class="links">
             
                <a href="/register.html">No account? Create one</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Copyright &copy; 2024 Personalized Tourist Guide - All Rights Reserved.</p>
        </div>
    </footer>
    <script src="/build/login.js"></script>
</body>
</html>
