<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <link href="profile.css?v=1.0" rel="stylesheet">
    <title>Profile - Personalized Tourist Guide</title>
    <script src="/config.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="/home_logged.html" class="brand">PERSONALIZED TOURIST GUIDE</a>
            </div>
        </nav>
    </header>

    <section class="hero-section">
        <div class="container hero-container">
            <div class="profile-header">
                <div class="profile">
                    <img id="profile-pic"  class="profile-pic">
                    <p id="user-name"></p>
                </div>
                <h1 class="profile-title">Profile</h1>
                <button class="edit-button">Edit</button>
            </div>
        </div>
    </section>

    <div class="content-container">
        <section class="personal-info-section">
            <h2>Personal information</h2>
            <div class="info-field">
                <i class="icon">👤</i>
                <input type="text" id="info-name" value="username" readonly>
            </div>
            <div class="info-field">
                <i class="icon">🔒</i>
                <input type="password" id="info-password" value="**********" readonly>
               
            </div>
            <div class="info-field">
                <i class="icon">📧</i>
                <input type="email" id="info-email" value="email" readonly>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Personalized Tourist Guide - All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Incluir apenas o bundle específico da página -->
    <script src="/build/profile.js"></script>
</body>
</html>
