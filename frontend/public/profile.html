<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <link href="profile.css?v=2.0" rel="stylesheet">
    <title>Profile - Personalized Tourist Guide</title>
    <script src="/config.js"></script>
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="/home_logged.html" class="brand">PERSONALIZED TOURIST GUIDE</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="hero-section" aria-labelledby="profile-title">
            <div class="profile-summary">
                <img id="profile-pic" class="profile-pic" src="default-avatar.svg" alt="Profile picture">
                <div>
                    <p class="eyebrow">Account</p>
                    <h1 id="profile-title">Profile</h1>
                    <p id="user-name" class="profile-name">Traveller</p>
                </div>
            </div>
            <button class="edit-button" type="button">Edit profile</button>
        </section>

        <section class="content-container personal-info-section" aria-labelledby="personal-info-title">
            <div class="section-header">
                <div>
                    <p class="eyebrow">Private area</p>
                    <h2 id="personal-info-title">Personal information</h2>
                </div>
            </div>

            <p id="profile-status" class="status-message is-hidden" aria-live="polite"></p>

            <div class="info-grid">
                <label class="info-field" for="info-name">
                    <span class="info-label">Name</span>
                    <input type="text" id="info-name" value="" readonly>
                </label>

                <label class="info-field" for="info-email">
                    <span class="info-label">Email</span>
                    <input type="email" id="info-email" value="" readonly>
                </label>

                <label class="info-field" for="info-password">
                    <span class="info-label">Password</span>
                    <input type="text" id="info-password" value="Hidden for security" readonly>
                </label>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2024 Personalized Tourist Guide - All Rights Reserved.</p>
    </footer>

    <script src="/build/profile.js"></script>
</body>
</html>
